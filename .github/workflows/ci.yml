name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel a superseded run when new commits land on the same PR/branch —
# saves free-tier Actions minutes instead of letting stale runs finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-ci:
    name: Node (lint, typecheck, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --if-present means a workspace package without this script is
      # skipped rather than failing the build — useful early on, when
      # e.g. packages/shared-types has no "test" script yet.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  python-ci:
    name: Python (lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: simulator/requirements.txt

      - name: Install dependencies
        run: pip install -r simulator/requirements.txt

      - name: Lint
        run: ruff check simulator/

      - name: Test
        run: pytest simulator/ -v

  openapi-lint:
    name: Lint OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships Node preinstalled, so this doesn't need the
      # pnpm/setup-node steps above — it's a standalone, fast check.
      - name: Lint openapi.yml
        run: npx --yes @redocly/cli lint apps/api/openapi/openapi.yml
