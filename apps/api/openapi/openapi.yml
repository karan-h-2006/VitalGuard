openapi: 3.0.3

info:
  title: VitalGuard API
  version: 0.1.0
  description: >
    IoT-based smart patient health monitoring system — backend REST API.
    This spec is the source of truth for the API surface. Every PR that
    adds, removes, or changes an endpoint must update this file in the
    same PR as the code change — see CONTRIBUTING.md.

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://staging-api.vitalguard.example.com
    description: Staging (placeholder — update once Render/Railway URL is known)

tags:
  - name: system
    description: Health checks and system status
  - name: auth
    description: Registration, login, and session management (F.18)
  - name: patients
    description: Patient records, associations, and dashboard views (F.19, F.22)
  - name: vitals
    description: Vital-sign readings and historical queries (F.24)
  - name: alerts
    description: Alert records, acknowledgment, and escalation (F.14–F.17)
  - name: thresholds
    description: Threshold and baseline configuration (F.20)
  - name: admin
    description: Governance, institutions, access assignment, and audit
  - name: notifications
    description: In-app notifications

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [system]
      summary: Health check
      description: Returns service status and uptime. No authentication required.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, uptimeSeconds]
                properties:
                  status:
                    type: string
                    example: ok
                  uptimeSeconds:
                    type: number
  /internal/simulated-devices:
    get:
      tags: [system]
      summary: Internal simulated devices discovery
      description: Returns active simulated devices for the multi-patient simulator service.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of active simulated devices
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [deviceId, patientId, scenario]
                  properties:
                    deviceId: { type: string, format: uuid }
                    patientId: { type: string, format: uuid }
                    scenario:
                      { type: string, enum: [normal, deteriorating, noisy] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Simulator service token not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /patients/{patientId}/device:
    parameters:
      - {
          name: patientId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      tags: [patients]
      summary: Get patient registered device
      description: Returns the registered device details for a patient.
      responses:
        '200':
          description: Registered device details
          content:
            application/json:
              schema:
                type: object
                required: [id, registrationStatus, isSimulated]
                properties:
                  id: { type: string, format: uuid }
                  patientId: { type: string, format: uuid, nullable: true }
                  registrationStatus:
                    { type: string, enum: [registered, de-registered] }
                  isSimulated: { type: boolean }
                  simScenario: { type: string, nullable: true }
                  createdAt: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /patients:
    get:
      tags: [patients]
      summary: List associated patients in triage priority order
      responses:
        '200':
          description: Critical, warning, watch, then normal patients with display labels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PatientTriageEntry' }

  /auth/register:
    post:
      tags: [auth]
      summary: Register a patient, caregiver, or doctor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201': { description: Account created and session token returned }
        '400':
          {
            description: Invalid details or administrator registration rejected,
          }
        '409': { description: Email already registered }
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: Session token returned }
        '401': { description: Invalid credentials }
        '429': { description: Rate limit reached }
  /auth/me:
    get:
      tags: [auth]
      summary: Return the current account
      responses:
        '200': { description: Account identity and password-change state }
        '401': { description: Authentication required }
  /auth/change-password:
    post:
      tags: [auth]
      summary: Change the current password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 10 }
      responses:
        '204': { description: Password changed }
        '400':
          {
            description: Password did not meet policy or current password was incorrect,
          }
  /auth/logout:
    post:
      tags: [auth]
      summary: End the current client session
      responses:
        '204': { description: Session ended }
  /institutions:
    get:
      tags: [admin]
      summary: List active institutions for signup
      security: []
      responses:
        '200': { description: Minimal active institution list }
        '429': { description: Public rate limit reached }
  /admin/institutions:
    get:
      tags: [admin]
      summary: Search institutions
      responses:
        '200': { description: Paginated institution list }
    post:
      tags: [admin]
      summary: Create an institution
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstitutionInput' }
      responses:
        '201': { description: Institution created and audited }
        '409': { description: Institution name already exists }
  /admin/institutions/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      tags: [admin]
      summary: Edit or activate/deactivate an institution
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstitutionInput' }
      responses:
        '200':
          { description: Updated institution and deactivation impact counts }
        '404': { description: Institution not found }
  /admin/overview:
    get:
      tags: [admin]
      summary: Governance counts and recent activity
      responses:
        '200': { description: Admin overview }
  /admin/doctor-requests:
    get:
      tags: [admin]
      summary: Search doctor applications
      responses:
        '200': { description: Paginated applications }
  /admin/doctor-requests/{userId}/approve:
    parameters:
      - {
          name: userId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [admin]
      summary: Approve a doctor application
      responses:
        '200': { description: Approved application; repeats are idempotent }
        '404': { description: Doctor application not found }
  /admin/doctor-requests/{userId}/reject:
    parameters:
      - {
          name: userId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [admin]
      summary: Reject a doctor application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 3 } }
      responses:
        '200': { description: Rejected application }
        '400': { description: Reason required }
  /admin/doctors:
    get:
      tags: [admin]
      summary: Search approved doctors and current patient counts
      responses:
        '200': { description: Paginated doctor list }
  /admin/doctors/{userId}/suspend:
    parameters:
      - {
          name: userId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [admin]
      summary: Suspend a doctor and return patients to the unassigned queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 3 } }
      responses:
        '200':
          { description: Doctor suspended and affected patient count returned }
        '404': { description: Doctor not found }
  /admin/doctors/{userId}/reinstate:
    parameters:
      - {
          name: userId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [admin]
      summary: Reinstate a suspended doctor
      responses:
        '200': { description: Doctor reinstated }
  /admin/patients:
    get:
      tags: [admin]
      summary: Search patients by assignment state and institution
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - {
            name: assignment,
            in: query,
            description: Omit to return all patients; records sort with unassigned first,
            schema: { type: string, enum: [unassigned, assigned] },
          }
        - {
            name: institutionId,
            in: query,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Paginated patient list including associated doctors and primary status
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminPatientRecord' }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
  /admin/devices/{deviceId}:
    parameters:
      - {
          name: deviceId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      tags: [admin]
      summary: Update device simulation scenario
      description: Administrator updates simulation scenario for a device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario:
                  type: string
                  enum: [normal, deteriorating, noisy]
      responses:
        '200':
          description: Device scenario updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId: { type: string, format: uuid }
                  patientId: { type: string, format: uuid, nullable: true }
                  isSimulated: { type: boolean }
                  scenario:
                    { type: string, enum: [normal, deteriorating, noisy] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/patients/{patientId}/assign-doctor:
    parameters:
      - {
          name: patientId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [admin]
      summary: Assign an approved doctor to a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doctorId]
              properties:
                doctorId: { type: string, format: uuid }
                isPrimary: { type: boolean }
                override: { type: boolean }
                reason: { type: string }
      responses:
        '200': { description: Assignment created or already exists }
        '409':
          {
            description: Doctor is ineligible or preferred institution does not match,
          }
  /admin/patients/{patientId}/doctors/{doctorId}:
    parameters:
      - {
          name: patientId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
      - {
          name: doctorId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    delete:
      tags: [admin]
      summary: Remove a doctor assignment
      responses:
        '204': { description: Assignment removed }
        '404': { description: Assignment not found }
  /admin/patients/{patientId}/transfer:
    parameters:
      - {
          name: patientId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [admin]
      summary: Transfer a patient between doctors atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromDoctorId, toDoctorId]
              properties:
                fromDoctorId: { type: string, format: uuid }
                toDoctorId: { type: string, format: uuid }
                override: { type: boolean }
                reason: { type: string }
      responses:
        '200': { description: Transfer completed }
        '409': { description: Destination doctor is ineligible }
  /admin/caregiver-requests:
    get:
      tags: [admin]
      summary: List caregiver link requests
      responses:
        '200': { description: Paginated requests }
  /admin/caregiver-requests/{id}/approve:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [admin]
      summary: Approve a caregiver request
      responses:
        '200':
          {
            description: Approved; patient consent is requested when configured,
          }
        '404': { description: Request or patient not found }
  /admin/caregiver-requests/{id}/reject:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [admin]
      summary: Reject a caregiver request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [reason],
                properties: { reason: { type: string } },
              }
      responses:
        '200': { description: Request rejected }
  /admin/patients/{patientId}/caregivers:
    parameters:
      - {
          name: patientId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [admin]
      summary: Create a direct caregiver link or consent request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [caregiverId],
                properties: { caregiverId: { type: string, format: uuid } },
              }
      responses:
        '200': { description: Link or request created }
        '404': { description: Account not found }
  /admin/patients/{patientId}/caregivers/{caregiverId}:
    parameters:
      - {
          name: patientId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
      - {
          name: caregiverId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    delete:
      tags: [admin]
      summary: Remove a caregiver link
      responses:
        '204': { description: Link removed }
  /admin/users:
    get:
      tags: [admin]
      summary: Search users
      responses:
        '200': { description: Paginated users }
    post:
      tags: [admin]
      summary: Create an additional administrator when enabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [role, email, password],
                properties:
                  {
                    role: { type: string, enum: [administrator] },
                    email: { type: string, format: email },
                    password: { type: string, format: password, minLength: 12 },
                  },
              }
      responses:
        '201':
          { description: Admin created; first login requires password rotation }
        '403': { description: Additional admin creation disabled }
  /admin/users/{userId}/suspend:
    parameters:
      - {
          name: userId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [admin]
      summary: Suspend a patient or caregiver account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [reason],
                properties: { reason: { type: string } },
              }
      responses:
        '200': { description: Account suspended }
        '409': { description: Use doctor suspension workflow for doctors }
  /admin/users/{userId}/reinstate:
    parameters:
      - {
          name: userId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [admin]
      summary: Reinstate a patient or caregiver account
      responses:
        '200': { description: Account reinstated }
  /admin/audit-log:
    get:
      tags: [admin]
      summary: Search immutable administrative audit events
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - {
            name: actor,
            in: query,
            description: Actor UUID or email address,
            schema: { type: string, maxLength: 320 },
          }
        - {
            name: action,
            in: query,
            description: Case-insensitive action substring,
            schema: { type: string, maxLength: 128 },
          }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Paginated audit events with resolved actor and target labels
          content:
            application/json:
              schema:
                type: object
                required: [items, page, limit, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminAuditEvent' }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
  /admin/totp/enroll:
    post:
      tags: [admin]
      summary: TOTP enrollment stub
      responses:
        '409': { description: TOTP disabled }
        '501': { description: TOTP provider not implemented }
  /admin/totp/verify:
    post:
      tags: [admin]
      summary: TOTP verification stub
      responses:
        '409': { description: TOTP disabled }
        '501': { description: TOTP provider not implemented }
  /caregiver/link-requests:
    get:
      tags: [patients]
      summary: List the current caregiver's link requests
      responses:
        '200': { description: Caregiver request status list }
    post:
      tags: [patients]
      summary: Submit a patient link request without revealing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [patientEmail],
                properties:
                  {
                    patientEmail: { type: string, format: email },
                    relationshipNote: { type: string },
                  },
              }
      responses:
        '202': { description: Request accepted for review }
  /doctors/me/application:
    get:
      tags: [auth]
      summary: Read current doctor application state
      responses:
        '200': { description: Application status and reapplication eligibility }
  /doctors/me/reapply:
    post:
      tags: [auth]
      summary: Resubmit a rejected doctor application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [institutionId, medicalLicenseNo, specialization],
                properties:
                  {
                    institutionId: { type: string, format: uuid },
                    medicalLicenseNo: { type: string },
                    specialization: { type: string },
                  },
              }
      responses:
        '202': { description: Application pending review }
        '409': { description: Application cannot be reapplied }
  /patients/me/profile:
    get:
      tags: [patients]
      summary: Read the patient's assignment state
      responses:
        '200': { description: Patient profile }
  /patients/me/access:
    get:
      tags: [patients]
      summary: List caregivers with access to the patient's data
      responses:
        '200': { description: Caregiver access list }
  /patients/me/caregiver-consents:
    get:
      tags: [patients]
      summary: List pending caregiver consent prompts
      responses:
        '200': { description: Pending consent requests }
  /patients/me/caregiver-consents/{requestId}:
    parameters:
      - {
          name: requestId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [patients]
      summary: Grant or deny caregiver access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [decision],
                properties: { decision: { type: string, enum: [grant, deny] } },
              }
      responses:
        '200': { description: Consent recorded and audited }
        '404': { description: Consent request not found }
  /patients/me/caregivers/{caregiverId}:
    parameters:
      - {
          name: caregiverId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    delete:
      tags: [patients]
      summary: Revoke caregiver access
      responses:
        '204': { description: Access revoked and audited }
  /notifications:
    get:
      tags: [notifications]
      summary: List the current user's notifications
      parameters:
        - name: unread
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200': { description: Up to 100 notifications }
  /notifications/read-all:
    post:
      tags: [notifications]
      summary: Mark all current-user notifications as read
      responses:
        '204': { description: Notifications marked read }
  /notifications/{id}/read:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      tags: [notifications]
      summary: Mark one notification as read
      responses:
        '200': { description: Notification marked read }
        '404': { description: Notification not found }
  /associations:
    post:
      tags: [patients]
      summary: Admin-only governed doctor assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [patientId, doctorId],
                properties:
                  {
                    patientId: { type: string, format: uuid },
                    doctorId: { type: string, format: uuid },
                    isPrimary: { type: boolean },
                    override: { type: boolean },
                    reason: { type: string },
                  },
              }
      responses:
        '201': { description: Assignment created }
        '403': { description: Administrator role required }
  /associations/{patientId}/{relationship}/{userId}:
    parameters:
      - {
          name: patientId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
      - {
          name: relationship,
          in: path,
          required: true,
          schema: { type: string, enum: [doctor, caregiver] },
        }
      - {
          name: userId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    delete:
      tags: [patients]
      summary: Admin-only doctor unassignment
      responses:
        '204': { description: Assignment removed }
        '403': { description: Administrator role required }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Core entities, taken directly from the SRS data dictionary
    # (Section 3.4 / Appendix). Defined here once so request/response
    # bodies can $ref them as endpoints get built — keeps the shape
    # consistent with packages/shared-types on the TypeScript side.

    User:
      type: object
      required: [id, role, email]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [patient, caregiver, doctor, administrator]
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time

    RegistrationRequest:
      type: object
      required: [role, email, password]
      properties:
        role: { type: string, enum: [patient, caregiver, doctor] }
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, format: password, minLength: 10 }
        preferredInstitutionId: { type: string, format: uuid }
        institutionId: { type: string, format: uuid }
        medicalLicenseNo: { type: string, maxLength: 128 }
        specialization: { type: string, maxLength: 255 }
        patientEmail: { type: string, format: email }

    InstitutionInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        type: { type: string, enum: [hospital, clinic, institute] }
        address: { type: string }
        city: { type: string, maxLength: 128 }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string, maxLength: 32 }
        status: { type: string, enum: [active, inactive] }

    Institution:
      type: object
      required: [id, name, type, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [hospital, clinic, institute] }
        city: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }

    DoctorApplication:
      type: object
      required:
        [userId, institutionId, medicalLicenseNo, specialization, status]
      properties:
        userId: { type: string, format: uuid }
        institutionId: { type: string, format: uuid }
        medicalLicenseNo: { type: string }
        specialization: { type: string }
        status: { type: string, enum: [pending, approved, rejected, suspended] }

    PatientProfile:
      type: object
      required: [userId, assignmentStatus]
      properties:
        userId: { type: string, format: uuid }
        preferredInstitutionId: { type: string, format: uuid, nullable: true }
        assignmentStatus: { type: string, enum: [unassigned, assigned] }

    Notification:
      type: object
      required: [id, recipientId, type, title, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        recipientId: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        readAt: { type: string, format: date-time, nullable: true }

    Device:
      type: object
      required: [id, patientId, registrationStatus]
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        registrationStatus:
          type: string
          enum: [registered, de-registered]

    Association:
      type: object
      required: [patientId, doctorId]
      properties:
        patientId:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        caregiverIds:
          type: array
          items:
            type: string
            format: uuid

    VitalReading:
      type: object
      required: [patientId, vitalType, value, timestamp]
      properties:
        patientId:
          type: string
          format: uuid
        vitalType:
          type: string
          enum: [heart_rate, spo2, temperature, respiratory_rate, motion]
        value:
          type: number
        timestamp:
          type: string
          format: date-time
        severityTier:
          type: string
          enum: [Normal, Watch, Warning, Critical]

    Baseline:
      type: object
      required: [patientId, vitalType, mean, stddev]
      properties:
        patientId:
          type: string
          format: uuid
        vitalType:
          type: string
        mean:
          type: number
        stddev:
          type: number
        windowSize:
          type: string
          description: e.g. "7d"
        updatedAt:
          type: string
          format: date-time

    Threshold:
      type: object
      required: [patientId, vitalType]
      properties:
        patientId:
          type: string
          format: uuid
        vitalType:
          type: string
        staticBand:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
        clinicianOverride:
          type: boolean
          default: false

    Alert:
      type: object
      required: [id, patientId, severityTier, status, openedAt]
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        severityTier:
          type: string
          enum: [Warning, Critical]
        triggeringVitals:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [open, acknowledged, escalated, resolved]
        openedAt:
          type: string
          format: date-time

    AuditLogEntry:
      type: object
      required: [eventId, transition, timestamp]
      properties:
        eventId:
          type: string
          format: uuid
        alertId:
          type: string
          format: uuid
          nullable: true
        transition:
          type: string
        actingUser:
          type: string
          format: uuid
          nullable: true
        timestamp:
          type: string
          format: date-time

    AdminAuditEvent:
      type: object
      required:
        [
          id,
          actorId,
          actorEmail,
          actorRole,
          action,
          targetType,
          targetLabel,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        actorEmail: { type: string, nullable: true }
        actorRole: { type: string, nullable: true }
        action: { type: string, description: Raw action identifier }
        targetType: { type: string }
        targetId: { type: string, format: uuid, nullable: true }
        targetLabel: { type: string, nullable: true }
        before: { nullable: true }
        after: { nullable: true }
        reason: { type: string, nullable: true }
        ip: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    AdminPatientRecord:
      type: object
      required: [profile, email, doctors]
      properties:
        profile: { type: object }
        email: { type: string, format: email }
        doctors:
          type: array
          items:
            type: object
            required: [patientId, doctorId, email, isPrimary]
            properties:
              patientId: { type: string, format: uuid }
              doctorId: { type: string, format: uuid }
              email: { type: string, format: email }
              isPrimary: { type: boolean }

    PatientTriageEntry:
      type: object
      required:
        [patientId, patientEmail, source, status, openAlertCount, lastReadingAt]
      properties:
        patientId: { type: string, format: uuid }
        patientEmail: { type: string, format: email, nullable: true }
        source: { type: string, enum: [redis, database, none] }
        status: { type: object, nullable: true }
        openAlertCount: { type: integer }
        lastReadingAt: { type: string, format: date-time, nullable: true }

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
